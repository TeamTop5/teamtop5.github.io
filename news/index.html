

<!DOCTYPE html>
<html lang="en">
<head>
<link rel="apple-touch-icon" href="/logo.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeamTop5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#2b1200; --muted:#4a2608; --accent:#9a2d00; --paper:rgba(255,248,228,.94); --amber:#2b1200; --amber-ink:#ffc23d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); font-family:'Outfit',system-ui,sans-serif; font-size:1.125rem; line-height:1.6;
  background:
    repeating-linear-gradient(45deg, #ffb703 0 40px, #fb8500 40px 80px);
  background-attachment:fixed; min-height:100vh;
}
main,header,footer{position:relative; z-index:1; max-width:68rem; margin:0 auto; padding-left:1.5rem; padding-right:1.5rem}
header{display:flex; justify-content:space-between; align-items:center; padding-top:1.5rem; gap:1rem; flex-wrap:wrap}
.logo{font-family:'Unbounded',sans-serif; font-weight:800; font-size:1.1rem; color:var(--ink); text-decoration:none}
nav{display:flex; gap:1.5rem}
nav a{color:var(--muted); text-decoration:none; font-weight:500}
nav a:hover{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink); outline-offset:3px; border-radius:6px}
.hero{padding:7rem 0 5rem; max-width:46rem}
h1{font-family:'Unbounded',sans-serif; font-weight:800; font-size:clamp(2.4rem,7vw,4.6rem); line-height:1.05; margin:0 0 1.5rem; letter-spacing:-.02em;}
.lead{color:var(--muted); font-size:1.3rem; max-width:34rem; margin:0 0 2.2rem}
.btn{display:inline-block; background:var(--amber); color:var(--amber-ink); font-family:'Unbounded',sans-serif; font-weight:500; font-size:1rem;
     padding:1rem 1.8rem; border-radius:999px; text-decoration:none; box-shadow:0 4px 0 rgba(0,0,0,.25); transition:transform .15s, box-shadow .15s}
.btn:hover{transform:scale(1.04)}
.btn.alt{background:transparent; color:var(--ink); border:2px solid var(--ink); box-shadow:none; margin-left:.8rem}
.btn.alt:hover{background:rgba(255,255,255,.3)}
section{padding:3rem 0}
h2{font-family:'Unbounded',sans-serif; font-weight:500; font-size:clamp(1.5rem,4vw,2.2rem); margin:0 0 2rem}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); gap:1.5rem}
.card{background:var(--paper); border:2px solid var(--ink); border-radius:1.2rem; padding:1.6rem}
.card h3{font-family:'Unbounded',sans-serif; font-weight:500; font-size:1.1rem; margin:0 0 .6rem; color:var(--accent)}
.card p{margin:0; color:var(--muted)}
.cta{text-align:center; padding:4rem 1.5rem; margin:3rem 0; border-radius:1.6rem; background:var(--paper); border:2px solid var(--ink)}
.cta h2 a{color:var(--ink)}
.cta h2{margin-bottom:1rem}
.cta p{color:var(--muted); margin:0 auto 2rem; max-width:30rem}
footer{padding-top:2rem; padding-bottom:3rem; color:var(--muted); font-size:.95rem}
@media (max-width:30rem){.btn.alt{margin:.8rem 0 0}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://teamtop5.github.io">TeamTop5</a>
  <nav aria-label="Main"><a href="https://teamtop5.github.io">HOME</a><a href="https://teamtop5.github.io/socials/">SOCIALS</a></nav>
</header>
<main id="top">
  <div class="hero">
    <h1>TEAMTOP5 NEWS</h1>
    <a class="btn" href="https://teamtop5.github.io">HOME</a><a class="btn" href="https://teamtop5.github.io/socials/">SOCIALS</a>
  </div>
  <section id="work">
    <h2>UPDATES</h2>
    <div class="grid">
<div class="grid">
      <div class="card"><h3>YouTube</h3><a href="https://youtube.com/@teamtop5hq">
        <img src="images/youtube.jpg" alt="youtube" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%;"></a>
      </div>
  
      <div class="card"><h3>X</h3><a href="https://x.com/TeamTop5">
        <img src="images/x.jpg" alt="x" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%;"></a>
      </div>

      <div class="card"><h3>TikTok</h3><a href="https://tiktok.com/@teamtop5official">
        <img src="images/tiktok.jpg" alt="tiktok" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%;"></a>
      </div>
 
      <div class="card"><h3>Discord</h3><a href="https://discord.gg/GvFaRtwhcq">
        <img src="images/discord.jpg" alt="discord" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%;"></a>
      </div>
  
      <div class="card"><h3>Instagram</h3><a href="https://instagram.com/teamtop5hq">
        <img src="images/instagram.jpg" alt="instagram" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%;"></a>
      </div>

      <div class="card"><h3>Facebook</h3><a href="https://www.facebook.com/profile.php?id=61573303904060">
        <img src="images/facebook.jpg" alt="facebook" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%;"></a>
      </div>
  
    </div>
  </section>
  <section class="cta" id="NEWS">
    <h2><a href="https://teamtop5.github.io">HOME</a></h2>
  
  </section>
</main>
<footer>© 2026 TeamTop5</footer>
</body>
</html>
